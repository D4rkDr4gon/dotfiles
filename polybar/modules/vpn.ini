[module/vpn]
type = custom/script
exec = /usr/bin/bash ~/.config/polybar/modules/vpn_status.sh
interval = 5

format = <label>
format-padding = 1
format-foreground = ${colors.primary}

click-left = /usr/bin/bash ~/.config/polybar/modules/vpn_toggle.sh
click-right = /usr/bin/bash ~/.config/polybar/modules/vpn_ip.sh
